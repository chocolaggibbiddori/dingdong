name: Build and Push Dingdong Vue Docker Image

on:
  push:
    branches:
      - dev
    paths:
      - 'frontend/dingdong-vue/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'frontend/dingdong-vue/**'

env:
  DOCKER_IMAGE_NAME: didrkd684/dingdong-vue
  WORKING_DIRECTORY: frontend/dingdong-vue
  DOCKERFILE_PATH: frontend/dingdong-vue/docker/Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: |
          if npm run test --if-present; then
            echo "Tests passed"
          else
            echo "No tests found or tests failed"
          fi
        continue-on-error: true

      - name: Build application
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Push Docker Image

    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=frontend-
            type=sha,prefix=frontend-dev-,suffix=-{{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=frontend-dev-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-notification:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Deployment Notification
    if: success()

    steps:
      - name: Notify deployment success
        run: |
          echo "🎉 Dingdong Vue Docker 이미지가 성공적으로 빌드되고 Docker Hub에 푸시되었습니다!"
          echo "이미지 이름: ${{ env.DOCKER_IMAGE_NAME }}"
          echo "브랜치: ${{ github.ref_name }}"
          echo "커밋 SHA: ${{ github.sha }}"
          echo "프로젝트: frontend/dingdong-vue"
